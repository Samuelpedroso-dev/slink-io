<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Slink.io</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --font:'Baloo 2','Nunito','Trebuchet MS',system-ui,sans-serif;
  --night:#100d2e;
  --panel:#1d1850;
  --panel2:#262066;
  --line:rgba(255,255,255,.10);
  --ink:#ffffff;
  --soft:#c4c3f2;
  --mute:#8d8bc4;
  --green:#8cf25a; --green-d:#3e9b2a; --green-dd:#276a1a;
  --gold:#ffc93d; --gold-d:#c98a00; --gold-dd:#8a5a00;
  --pink:#ff6fa5; --sky:#5cc8ff; --violet:#8f7bff;
  --r:22px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --night:#100d2e; color-scheme:dark; } }
:root[data-theme="dark"]{ --night:#100d2e; color-scheme:dark; }
*,*::before,*::after{ box-sizing:border-box; }
html{ height:100%; scroll-padding-top:env(safe-area-inset-top,0px); }
body{
  margin:0; height:100%; overflow:hidden; position:fixed; inset:0; background:var(--night);
  font-family:var(--font); color:var(--ink); -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent;
}
button{ font-family:var(--font); }
#game{ position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
.hidden{ display:none !important; }
svg{ display:block; }
:focus-visible{ outline:3px solid #fff; outline-offset:3px; }

/* ---------- shared pieces ---------- */
.coin{ display:inline-block; flex:none; width:20px; height:20px; border-radius:50%; position:relative;
  background:radial-gradient(circle at 35% 30%, #fff7cc 0%, #ffd24a 40%, #e09a00 100%);
  box-shadow:inset 0 -2px 0 rgba(120,60,0,.45), 0 0 0 2px #7a4a00; }
.coin::after{ content:''; position:absolute; left:5px; top:4px; width:6px; height:4px; border-radius:50%; background:rgba(255,255,255,.75); transform:rotate(-30deg); }
.coin.sm{ transform:scale(.8); }
.gem{ display:inline-block; flex:none; width:20px; height:20px; position:relative;
  background:linear-gradient(135deg,#e8fdff 0%,#7fe6ff 35%,#35a8ff 70%,#2a62e8 100%);
  clip-path:polygon(50% 100%, 0 36%, 22% 6%, 78% 6%, 100% 36%); filter:drop-shadow(0 0 1px #0b2a6b); }
.gem::after{ content:''; position:absolute; left:28%; top:14%; width:22%; height:22%; background:rgba(255,255,255,.85); clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%); }
.gem.sm{ transform:scale(.85); }
.coinPill .gemValue{ color:#9fe8ff; }
.coinPill{ display:inline-flex; align-items:center; gap:7px; height:40px; padding:0 10px 0 8px; border-radius:999px;
  background:rgba(12,9,40,.72); border:2px solid var(--line); color:#ffe38a; font-weight:800; font-size:1.15rem; cursor:pointer; }
.coinPill .plus{ width:22px; height:22px; border-radius:50%; background:var(--green); color:#18430f; display:grid; place-items:center; font-size:1.1rem; line-height:1; }
.iconBtn{ width:44px; height:44px; border-radius:14px; border:2px solid var(--line); background:rgba(12,9,40,.72); color:#fff;
  display:grid; place-items:center; cursor:pointer; }
.glass{ background:rgba(20,16,58,.78); border:2px solid var(--line); border-radius:var(--r); }
.gummy{ position:relative; border:0; cursor:pointer; color:#fff; font-weight:800; border-radius:20px;
  transition:transform .08s ease, box-shadow .08s ease; }
.gummy:active{ transform:translateY(3px); }
.gummy.green{ background:linear-gradient(180deg,#a8ff72 0%, var(--green) 45%, #6ed63f 100%); color:#1b4a10; box-shadow:0 6px 0 var(--green-d), 0 10px 18px rgba(0,0,0,.35); }
.gummy.green:active{ box-shadow:0 3px 0 var(--green-d), 0 6px 12px rgba(0,0,0,.35); }
.gummy.gold{ background:linear-gradient(180deg,#ffe38a 0%, var(--gold) 50%, #f0a800 100%); color:#5a3a00; box-shadow:0 6px 0 var(--gold-d), 0 10px 18px rgba(0,0,0,.3); }
.gummy.gold:active{ box-shadow:0 3px 0 var(--gold-d); }
.gummy.violet{ background:linear-gradient(180deg,#a99bff 0%, var(--violet) 50%, #6f59f0 100%); box-shadow:0 6px 0 #4a36b8, 0 10px 18px rgba(0,0,0,.3); }
.gummy.violet:active{ box-shadow:0 3px 0 #4a36b8; }
.gummy.sky{ background:linear-gradient(180deg,#3e4fd6 0%, #2b37b0 55%, #222b92 100%); color:#ffffff; box-shadow:0 0 0 2px #7fe6ff inset, 0 6px 0 #151b62, 0 10px 18px rgba(0,0,0,.3); }
.gummy.sky:active{ box-shadow:0 0 0 2px #7fe6ff inset, 0 3px 0 #151b62; }
.gummy.sky .gem{ transform:scale(1); }
.gummy.plain{ background:rgba(255,255,255,.1); box-shadow:0 4px 0 rgba(0,0,0,.25); color:var(--soft); }
.gummy:disabled{ filter:grayscale(.6) brightness(.8); cursor:default; transform:none; }
.gummy::before{ content:''; position:absolute; left:14px; right:14px; top:4px; height:7px; border-radius:999px; background:rgba(255,255,255,.35); pointer-events:none; }
.badge{ position:absolute; top:-8px; right:-8px; min-width:24px; height:24px; padding:0 7px; border-radius:12px; background:var(--pink);
  color:#fff; font-size:.85rem; font-weight:800; line-height:24px; text-align:center; box-shadow:0 0 0 3px var(--night); }
.pulse{ animation:pulse 1.4s ease-in-out infinite; }
@keyframes pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.06); } }
@keyframes floaty{ 0%,100%{ transform:translateY(0) rotate(-4deg); } 50%{ transform:translateY(-6px) rotate(-2deg); } }
@keyframes pop{ from{ transform:scale(.85); opacity:0; } to{ transform:scale(1); opacity:1; } }
@media (prefers-reduced-motion: reduce){ .pulse,.logo{ animation:none !important; } .gummy{ transition:none; } }

/* ---------- menu (classic layout over the animated arena) ---------- */
.ol{ text-shadow:0 2px 0 #1a1450, 2px 0 0 #1a1450, -2px 0 0 #1a1450, 0 -2px 0 #1a1450, 2px 2px 0 #1a1450, -2px 2px 0 #1a1450, 2px -2px 0 #1a1450, -2px -2px 0 #1a1450; }
#menu{ position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
  padding:calc(60px + env(safe-area-inset-top,0px)) 16px calc(112px + env(safe-area-inset-bottom,0px));
  background:radial-gradient(ellipse at 50% 45%, rgba(16,13,46,0) 0%, rgba(16,13,46,.4) 62%, rgba(8,6,24,.85) 100%); text-align:center; overflow:hidden; }
#menuCoins{ position:absolute; top:calc(12px + env(safe-area-inset-top,0px)); left:12px; }
#settingsBtn{ position:absolute; top:calc(8px + env(safe-area-inset-top,0px)); right:10px; background:none; border:0; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; font-weight:800; font-size:.95rem; color:#8dff5a; }
#settingsBtn svg{ width:44px; height:44px; color:#8a5cf5; filter:drop-shadow(0 3px 0 #2b1872); }
.logoWrap{ position:relative; width:min(380px,92vw); height:160px; flex:none; }
#logoSnake{ position:absolute; inset:0; width:100%; height:100%; }
.logo{ position:absolute; left:0; right:0; top:46%; transform:translateY(-50%) rotate(-5deg); margin:0;
  font-size:clamp(3.2rem,16vw,4.6rem); font-weight:800; line-height:1; letter-spacing:.5px;
  background:linear-gradient(90deg,#8dff5a 0%,#6ff0d0 22%,#8ab8ff 44%,#c88bff 64%,#ff8fd0 82%,#ffd86a 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 3px 0 #1c1256) drop-shadow(0 -2px 0 #1c1256) drop-shadow(2px 0 0 #1c1256) drop-shadow(-2px 0 0 #1c1256) drop-shadow(0 10px 14px rgba(0,0,0,.35)); }
.statsRow{ display:flex; justify-content:space-between; width:min(470px,94vw); pointer-events:none; }
.stat{ min-width:130px; text-shadow:0 2px 4px rgba(0,0,0,.8); }
.stat h3{ margin:0 0 4px; font-size:1rem; color:#c9c6ff; font-weight:800; padding-bottom:2px; border-bottom:2px solid rgba(201,198,255,.25); }
.stat .srow{ display:flex; justify-content:center; gap:10px; font-weight:800; font-size:1.1rem; line-height:1.25; }
.lblSize{ color:#a8c4ff; } .lblBoops{ color:#ff8a8a; }
.stat b{ color:#fff; min-width:3.2em; text-align:left; }
#nameInput{ width:min(300px,78vw); text-align:center; padding:9px 18px; border-radius:999px; border:0; outline:none;
  background:rgba(255,255,255,.16); color:#fff; font-family:var(--font); font-size:1.25rem; font-weight:600; }
#nameInput::placeholder{ color:rgba(255,255,255,.55); }
#nameInput:focus-visible{ box-shadow:0 0 0 3px rgba(255,255,255,.5); }
.playBtn{ border:0; cursor:pointer; padding:8px 46px 12px; border-radius:999px; font-family:var(--font); font-weight:800;
  font-size:2.1rem; line-height:1; color:#b9ff3c; background:radial-gradient(circle at 50% 28%, #6fd3ff 0%, #2289ec 52%, #1552b8 100%);
  box-shadow:0 0 0 4px #0f3a8a, 0 8px 0 #0b2b66, 0 16px 26px rgba(0,0,0,.35); }
.playBtn:active{ transform:translateY(3px); box-shadow:0 0 0 4px #0f3a8a, 0 5px 0 #0b2b66, 0 10px 18px rgba(0,0,0,.35); }
.aiBtn{ border:0; cursor:pointer; padding:8px 28px 9px; border-radius:999px; font-family:var(--font); font-weight:800;
  font-size:1.1rem; letter-spacing:1px; color:#ffcf4a; background:linear-gradient(#a275ff,#6a3fd8); box-shadow:0 0 0 3px #3b2393, 0 5px 0 #2b1872; }
.aiBtn:active{ transform:translateY(2px); }
.corner{ position:absolute; bottom:calc(8px + env(safe-area-inset-bottom,0px)); background:none; border:0; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; font-family:var(--font); font-weight:800; font-size:1.05rem; color:#8dff5a; }
#shopBtn{ left:10px; } #missionsBtn{ right:10px; }
#skinPreview{ width:92px; height:70px; }
.cornerIco{ width:76px; height:70px; display:grid; place-items:center; filter:drop-shadow(0 4px 6px rgba(0,0,0,.35)); }
.cornerIco .chestIco{ width:70px; height:62px; }
.corner .badge{ top:-2px; right:2px; }
@media (orientation: landscape) and (max-height: 560px){
  #menu{ padding:calc(8px + env(safe-area-inset-top,0px)) 16px calc(70px + env(safe-area-inset-bottom,0px)); gap:8px; }
  .logoWrap{ height:118px; width:min(340px,50vw); }
  .logo{ font-size:3.4rem; }
  .statsRow{ position:absolute; left:0; right:0; top:42%; width:auto; padding:0 max(18px,4vw); }
  #nameInput{ width:min(280px,40vw); padding:7px 16px; font-size:1.1rem; }
  .playBtn{ font-size:1.8rem; padding:6px 42px 10px; }
}
/* ---------- sheets (shop, missions, settings) ---------- */
.sheet{ position:fixed; inset:0; z-index:20; display:flex; flex-direction:column; background:var(--night); animation:pop .18s ease;
  padding:calc(10px + env(safe-area-inset-top,0px)) 0 0; }
.sheetBar{ display:flex; align-items:center; gap:10px; padding:0 14px 10px; }
.sheetBar h2{ flex:1; margin:0; font-size:1.7rem; font-weight:800; line-height:1; }
.tabs{ display:flex; gap:6px; padding:0 14px 10px; }
.tab{ flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; gap:2px; padding:7px 4px 6px; border-radius:16px; border:2px solid transparent;
  background:rgba(255,255,255,.06); color:var(--mute); font-weight:800; font-size:.85rem; cursor:pointer; }
.tab svg{ width:22px; height:22px; }
.tabIco{ display:grid; place-items:center; }
.tab .coin{ width:22px; height:22px; }
.tab.on{ background:var(--panel2); color:#fff; border-color:rgba(255,255,255,.18); }
.sheetBody{ flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:4px 14px calc(24px + env(safe-area-inset-bottom,0px)); }
.secTitle{ display:flex; align-items:center; gap:8px; font-weight:800; font-size:1.1rem; margin:14px 2px 8px; color:var(--soft); }
.secTitle i{ flex:1; height:2px; background:var(--line); border-radius:2px; }
.grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(148px,1fr)); gap:10px; }
.card{ position:relative; background:var(--panel); border:2px solid var(--line); border-radius:20px; padding:8px; display:flex; flex-direction:column; gap:6px; }
.card canvas{ width:100%; height:78px; border-radius:14px; background:#0c0a24; display:block; }
.card .cName{ font-weight:800; font-size:1.05rem; line-height:1.05; padding:0 2px; }
.card .cTag{ font-size:.75rem; font-weight:800; padding:1px 8px; border-radius:999px; align-self:flex-start; background:rgba(255,255,255,.1); color:var(--soft); }
.card.r-rara{ border-color:rgba(92,200,255,.5); } .card.r-rara .cTag{ background:rgba(92,200,255,.18); color:#9fdcff; }
.card.r-lendaria{ border-color:rgba(255,201,61,.7); background:linear-gradient(180deg,#2f2560,#1d1850); }
.card.r-lendaria .cTag{ background:rgba(255,201,61,.2); color:#ffd970; }
.card.r-custom{ border-color:rgba(255,111,165,.55); } .card.r-custom .cTag{ background:rgba(255,111,165,.2); color:#ff9cc3; }
.card.using{ box-shadow:0 0 0 3px var(--green) inset; }
.card .cBtn, .card .usingTag{ margin-top:auto; }
.cBtn{ height:38px; border-radius:14px; font-size:1rem; display:flex; align-items:center; justify-content:center; gap:6px; }
.usingTag{ height:38px; display:flex; align-items:center; justify-content:center; gap:4px; color:var(--green); font-weight:800; }
.row{ display:flex; align-items:center; gap:12px; background:var(--panel); border:2px solid var(--line); border-radius:20px; padding:12px; margin-bottom:10px; }
.row .rIco{ width:48px; height:48px; border-radius:14px; display:grid; place-items:center; flex:none; }
.row .rIco svg{ width:28px; height:28px; }
.row .rTxt{ flex:1; min-width:0; font-weight:800; line-height:1.15; }
.row .rTxt small{ display:block; font-weight:700; color:var(--mute); font-size:.85rem; }
.row .cBtn{ min-width:100px; padding:0 12px; }
.fine{ color:var(--mute); font-weight:600; font-size:.85rem; text-align:center; margin:10px 8px; }

/* creator */
.creator{ display:flex; flex-direction:column; gap:12px; }
#creatorCv{ width:100%; height:130px; border-radius:20px; background:#0c0a24; border:2px solid var(--line); }
.slots{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.slot{ width:44px; height:44px; border-radius:50%; border:3px solid rgba(255,255,255,.2); cursor:pointer; box-shadow:inset 0 -5px 0 rgba(0,0,0,.25); }
.slot.sel{ border-color:#fff; transform:scale(1.08); box-shadow:0 0 0 3px var(--green), inset 0 -5px 0 rgba(0,0,0,.25); }
.slotAdd{ width:44px; height:44px; border-radius:50%; border:2px dashed rgba(255,255,255,.35); background:none; color:#fff; font-size:1.5rem; cursor:pointer; }
.palette{ display:grid; grid-template-columns:repeat(9,1fr); gap:6px; }
.sw{ aspect-ratio:1; border-radius:12px; border:2px solid rgba(255,255,255,.12); cursor:pointer; box-shadow:inset 0 -4px 0 rgba(0,0,0,.25); }
.seg{ display:flex; background:rgba(255,255,255,.06); border-radius:14px; padding:4px; gap:4px; }
.seg button{ flex:1; border:0; border-radius:10px; padding:8px 4px; background:none; color:var(--mute); font-weight:800; font-size:.92rem; cursor:pointer; }
.seg button.on{ background:var(--panel2); color:#fff; }
.fieldLbl{ font-weight:800; color:var(--soft); font-size:.95rem; margin-bottom:-4px; }
.textIn{ width:100%; height:44px; border-radius:14px; border:2px solid var(--line); background:rgba(0,0,0,.28); color:#fff; font-family:var(--font); font-weight:700; font-size:1.1rem; padding:0 12px; outline:none; }
.textIn:focus{ border-color:var(--green); }

/* missions */
.mHero{ position:relative; overflow:hidden; border-radius:24px; padding:14px; background:linear-gradient(135deg,#3b2fa8,#6b3fd0 60%,#c04fb8); border:2px solid rgba(255,255,255,.18); }
.mHero h3{ margin:0; font-size:1.5rem; font-weight:800; line-height:1; }
.mHero .timer{ font-weight:700; color:#f1e9ff; opacity:.9; font-size:.92rem; margin-top:2px; }
.chestRow{ display:flex; align-items:center; gap:12px; margin-top:12px; }
.chestIco{ width:62px; height:56px; flex:none; }
.pips{ flex:1; display:flex; gap:6px; }
.pip{ flex:1; height:14px; border-radius:8px; background:rgba(0,0,0,.28); overflow:hidden; }
.pip i{ display:block; height:100%; width:0; background:linear-gradient(90deg,#ffe38a,var(--gold)); border-radius:8px; }
.pip.full i{ width:100%; }
.chestTxt{ font-weight:800; font-size:.9rem; margin-top:4px; color:#fff3c4; }
.streakCard{ padding:12px; margin-top:12px; }
.streakHead{ display:flex; justify-content:space-between; align-items:baseline; font-weight:800; margin-bottom:8px; }
.streakHead small{ color:var(--mute); font-weight:700; }
.days{ display:grid; grid-template-columns:repeat(6,minmax(0,1fr)) minmax(0,1.35fr); gap:5px; }
.day{ position:relative; border-radius:14px; padding:6px 0 5px; text-align:center; background:rgba(255,255,255,.06); border:2px solid transparent; font-weight:800; }
.day small{ display:block; font-size:.7rem; color:var(--mute); }
.day b{ display:block; font-size:.9rem; color:#ffe38a; }
.day.done{ background:rgba(140,242,90,.14); }
.day.done b{ color:var(--green); }
.day.today{ border-color:var(--gold); background:rgba(255,201,61,.16); }
.day.big{ background:linear-gradient(180deg,rgba(255,201,61,.28),rgba(255,111,165,.2)); }
.mission{ display:flex; gap:12px; align-items:center; background:var(--panel); border:2px solid var(--line); border-radius:20px; padding:12px; margin-bottom:10px; }
.mission.ready{ border-color:var(--gold); background:linear-gradient(180deg,#342a70,#241e5c); }
.mission.claimed{ opacity:.6; }
.mIco{ width:52px; height:52px; border-radius:16px; flex:none; display:grid; place-items:center; box-shadow:inset 0 -5px 0 rgba(0,0,0,.2); }
.mIco svg{ width:30px; height:30px; }
.mBody{ flex:1; min-width:0; }
.mTxt{ font-weight:800; line-height:1.15; font-size:1.02rem; }
.mBar{ position:relative; height:22px; border-radius:11px; background:rgba(0,0,0,.3); margin-top:7px; overflow:hidden; }
.mBar i{ position:absolute; left:0; top:0; bottom:0; border-radius:11px; background:linear-gradient(180deg,#b6ff8a,var(--green) 60%,#62c436); }
.mBar span{ position:relative; display:block; text-align:center; font-weight:800; font-size:.8rem; line-height:22px; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.6); }
.mSide{ display:flex; flex-direction:column; align-items:center; gap:6px; flex:none; }
.mRw{ display:flex; align-items:center; gap:4px; font-weight:800; color:#9fe8ff; }
.mSide .cBtn{ height:36px; padding:0 12px; font-size:.95rem; }
.reroll{ width:36px; height:36px; border-radius:12px; border:2px solid var(--line); background:rgba(255,255,255,.06); color:var(--sky); display:grid; place-items:center; cursor:pointer; }
.reroll svg{ width:20px; height:20px; }

/* settings */
.ctrlGrid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.ctrlOpt{ display:flex; flex-direction:column; align-items:center; gap:6px; padding:10px 8px 10px; border-radius:20px; background:var(--panel); border:2px solid var(--line); cursor:pointer; color:#fff; }
.ctrlOpt.on{ border-color:var(--green); box-shadow:0 0 0 2px var(--green) inset; background:#243058; }
.ctrlOpt svg{ width:100%; max-width:150px; height:auto; aspect-ratio:140/84; }
.ctrlOpt b{ font-size:1rem; line-height:1; }
.ctrlOpt small{ font-size:.78rem; color:var(--mute); font-weight:700; text-align:center; line-height:1.15; }
.optRow{ display:flex; align-items:center; justify-content:space-between; gap:12px; background:var(--panel); border:2px solid var(--line); border-radius:18px; padding:10px 14px; margin-bottom:8px; font-weight:800; }
.optRow small{ display:block; font-weight:700; color:var(--mute); font-size:.82rem; }
.switch{ position:relative; width:54px; height:32px; flex:none; }
.switch input{ position:absolute; opacity:0; inset:0; margin:0; cursor:pointer; }
.switch i{ position:absolute; inset:0; border-radius:16px; background:rgba(255,255,255,.14); transition:background .15s; pointer-events:none; }
.switch i::after{ content:''; position:absolute; left:4px; top:4px; width:24px; height:24px; border-radius:50%; background:#fff; transition:transform .15s; box-shadow:0 2px 0 rgba(0,0,0,.25); }
.switch input:checked + i{ background:var(--green-d); }
.switch input:checked + i::after{ transform:translateX(22px); }
.switch input:focus-visible + i{ outline:3px solid #fff; outline-offset:2px; }

@media (orientation: landscape) and (max-height: 560px){
  .tab{ flex-direction:row; justify-content:center; gap:6px; padding:6px 4px; }
  .tab svg{ width:18px; height:18px; }
  .tab .coin{ width:18px; height:18px; }
  .ctrlGrid{ grid-template-columns:repeat(4,1fr); }
  .sheetBar h2{ font-size:1.4rem; }
}
/* ---------- HUD ---------- */
#hud{ position:fixed; inset:0; pointer-events:none; }

#rankBox{ position:absolute; left:12px; bottom:calc(8px + env(safe-area-inset-bottom,0px)); font-weight:800; font-size:1.05rem; text-shadow:0 1px 3px rgba(0,0,0,.9); }

#massVal{ font-size:2.6rem; font-weight:800; line-height:.95; }
#massLbl{ font-size:1.05rem; font-weight:800; color:#8f9aff; }

#boopVal{ font-size:2.3rem; font-weight:800; line-height:.95; }

body{ --cs:122px; }

.sideL{ left:20px; } .sideR{ right:20px; }
#joyBase{ background:rgba(255,255,255,.07); border:2px solid rgba(255,255,255,.08); will-change:transform; }

.turn.on{ background:rgba(255,255,255,.2); }

#deathScreen .earn{ display:flex; align-items:center; gap:8px; }
#deathScreen .earn b{ color:#ffe38a; }

.newBest{ color:#ffe17a; font-weight:800; font-size:1.05rem; }
#deathScreen .playBtn{ margin-top:22px; }
#deathScreen .aiBtn{ margin-top:16px; }

/* ---------- offline ---------- */

  for(let i=0;i<usedCells.length;i++) bodyGrid[usedCells[i]].length = 0;
  usedCells.length = 0;
  for(const s of list){
    if(s.ghost > 0) continue;
    const segs = s.segs;
    for(let i=0;i<segs.length;i+=2){
      const g = segs[i]; const idx = bcx(g.y)*BGN + bcx(g.x);

    for(let cx=x0; cx<=x1; cx++){

/* ---------- snakes ---------- */
function diamOf(m){ return 12 + Math.sqrt(Math.min(m,3000))*0.55 + Math.sqrt(Math.max(0,m-3000))*0.13; }
function segCountOf(m){ return Math.min(235, Math.floor(8 + Math.pow(m,0.7)*0.95)); }

let snakes = [], player = null, idc = 1;
function makeSnake(o){
  const s = { id:idc++, name:o.name, skin:o.skin, isBot:!!o.isBot, pers:o.pers||'passive', mass:o.mass,
    x:o.x, y:o.y, angle:(o.angle!=null ? o.angle : rand(0,TAU)), boosting:false, dropAcc:0, alive:true, boops:0,

function botMass(){ const r = Math.random(); if(r<0.12) return rand(500,3000); if(r<0.45) return rand(70,420); return rand(CONFIG.startMass,60); }

function botOptions(awayFromPlayer, fixedMass){
  const mass = fixedMass || botMass();

  while(player && tries<10 && Math.hypot(p.x-player.x, p.y-player.y) < awayFromPlayer);
  const r = Math.random();
  let skill = r < 0.1 ? rand(0.05,0.35) : r < 0.3 ? rand(0.4,0.65) : rand(0.65,0.95);
  if(mass > 3000) skill = rand(0.8,0.98);

    skill, greed:rand(0.55,1), hunter:Math.random() < 0.6 };
}
function spawnBot(minDist, fixedMass){
  let s = null;

    s = makeSnake(botOptions(minDist, fixedMass));

function speedOf(s){ return CONFIG.baseSpeed * (s.boosting ? CONFIG.boostMult : 1); }
function turnOf(s){ return 0.14 * Math.max(0.5, 1 - Math.sqrt(s.mass)*0.012) * (s.boosting ? 0.8 : 1); }

  addFood(t.x + rand(-s.d*0.4,s.d*0.4), t.y + rand(-s.d*0.4,s.d*0.4), v, segColor(s, n-1), false);

  const sp = speedOf(s)*f;

  if(s.boosting && s.mass > CONFIG.minBoostMass){
    const drain = (0.035 + s.mass*0.0006)*f;

  } else {
    s.boosting = false;

  for(let cy=y0; cy<=y1; cy++){
    for(let cx=x0; cx<=x1; cx++){
      const arr = foodGrid[cy*FGN+cx];
      for(let k=arr.length-1; k>=0; k--){
        const fd = arr[k]; const dx = fd.x-s.x, dy = fd.y-s.y, d2 = dx*dx+dy*dy;

function killSnake(s, killer){

  const n = s.segs.length, pellets = Math.max(6, Math.min(s.mass > 5000 ? 260 : 150, Math.floor(n/1.05)));

  for(let k=0;k<pellets;k++){
    const idx = Math.floor(k/pellets*n); const g = s.segs[idx] || s;
    let fx = g.x + rand(-s.d*0.45, s.d*0.45), fy = g.y + rand(-s.d*0.45, s.d*0.45);

  else s.respawn = rand(60,200);

/* ---------- AI ----------
   every bot wants to grow (food, drops, hunting) but also wants to live (threat evasion, look ahead).
   skill, greed and hunter are hidden per bot traits, so some bots are sharp and a few are clumsy. */
const HCELL = 300, HOFF = R+600, HGN = Math.ceil((2*HOFF)/HCELL);
const headGrid = new Array(HGN*HGN); for(let i=0;i<headGrid.length;i++) headGrid[i] = [];
const headUsed = [];
function hcx(x){ return clamp(((x+HOFF)/HCELL)|0, 0, HGN-1); }

  for(let i=0;i<headUsed.length;i++) headGrid[headUsed[i]].length = 0;
  headUsed.length = 0;
  for(const s of snakes){ if(!s.alive) continue; const idx = hcx(s.y)*HGN + hcx(s.x); if(!headGrid[idx].length) headUsed.push(idx); headGrid[idx].push(s); }
}
function forHeadsNear(x, y, r, fn){

}
function bestFoodNear(s, radius){
  const x0 = fcx(s.x-radius), x1 = fcx(s.x+radius), y0 = fcx(s.y-radius), y1 = fcx(s.y+radius);
  const ca = Math.cos(s.angle), sa = Math.sin(s.angle);
  const caution = s.skill*(1.3 - s.greed*0.6)*0.8;
  let best = null, bestScore = 0;
  for(let cy=y0; cy<=y1; cy++) for(let cx=x0; cx<=x1; cx++){
    const arr = foodGrid[cy*FGN+cx];

function botAvoid(s){

    const th = findThreat(s);

function serverMasses(n){
  const top = rand(12000, 32000), alpha = rand(0.42, 0.62), bigN = Math.max(6, Math.round(n*0.045));
  const out = [];
  for(let i=0;i<n;i++) out.push(i < bigN ? top*Math.pow(i+1, -alpha)*rand(0.9, 1.08) : botMass());
  return out;

function safeSpawnPoint(){
  let best = null, bestD = -1;
  for(let t=0;t<60;t++){
    const p = randomPoint(R*0.6); let md = 1e12;
    for(const s of snakes){
      const segs = s.segs, step = Math.max(2, (segs.length/25)|0);
      const dh = (s.x-p.x)*(s.x-p.x) + (s.y-p.y)*(s.y-p.y); if(dh < md) md = dh;

function update(f){

    else { player.target = Math.atan2(input.dy, input.dx); steerAngle = player.target; }
    player.look = player.target;
    player.boosting = input.boost;
  }
  const halfW = W/2/cam.z + 450, halfH = H/2/cam.z + 450;
  const active = [];
  for(const s of snakes){
    if(!s.alive) continue;
    let act = s === player || (Math.abs(s.x-cam.x) < halfW && Math.abs(s.y-cam.y) < halfH);
    if(!act){
      /* long bodies can cross the screen while the head is far away, so check the body too */
      const reach = s.segs.length*s.d*SPACING;
      if(Math.abs(s.x-cam.x) < halfW + reach && Math.abs(s.y-cam.y) < halfH + reach){
        const segs = s.segs;
        for(let i=0;i<segs.length;i+=4){ const g = segs[i]; if(Math.abs(g.x-cam.x) < halfW && Math.abs(g.y-cam.y) < halfH){ act = true; break; } }

  }

    s.respawn -= f;
    if(s.respawn <= 0) Object.assign(s, spawnBot(1000));
  }
  if(player.alive){
    track.time += f/60;
    if(player.boosting) track.boostT += f/60;
    const n = player.segs.length, tl = player.segs[n-1], pd = player.d, c = player.skin.c;
    if(tl && stats.hq){
      const bodyPt = () => player.segs[Math.floor(rand(n*0.25, n))] || tl;

let lastT = 0, looping = false;
function loop(t){
  if(!running){ looping = false; return; }
  looping = true;
  const dtMs = Math.min(50, t - lastT || 16.7); lastT = t;
  const f = dtMs/16.667;
  update(f);

  hudTimer -= dtMs; if(hudTimer <= 0){ hudTimer = 400; updateHUD(); }

  requestAnimationFrame(loop);
}

function dayKey(d){ d = d || new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }

function timeToMidnight(){ const n = new Date(), m = new Date(n); m.setHours(24,0,0,0); const ms = m-n; return Math.floor(ms/3600000)+'h '+Math.floor(ms%3600000/60000)+'min'; }

const MISSION_TYPES = [

  {t:'size',    lv:[150,400,900],  rw:[3,3,5],  ic:'snake',  col:'#8cf25a', txt:v => 'Chegue a tamanho '+fmt(v)},
  {t:'boops',   lv:[1,3,6],        rw:[3,5,5], ic:'burst',  col:'#ffb14a', txt:v => 'Faça '+v+(v>1 ? ' boops' : ' boop')},
  {t:'top10',   lv:[1],            rw:[5],         ic:'trophy', col:'#ffd35a', txt:() => 'Entre no top 50'},

];
const MT = {}; for(const m of MISSION_TYPES) MT[m.t] = m;
function hashStr(str){ let h = 2166136261; for(let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h,16777619); } return h>>>0; }
function seeded(seed){ let x = seed || 1; return () => { x ^= x << 13; x >>>= 0; x ^= x >>> 17; x ^= x << 5; x >>>= 0; return x/4294967296; }; }
function genMission(rnd, exclude){
  let mt, guard = 0;
  do { mt = MISSION_TYPES[(rnd()*MISSION_TYPES.length)|0]; guard++; } while(exclude.indexOf(mt.t) >= 0 && guard < 50);
  const li = (rnd()*mt.lv.length)|0;
  return {t:mt.t, target:mt.lv[li], reward:mt.rw[li], prog:0, done:false, claimed:false};
}
function ensureDaily(){
  const today = dayKey();
  if(stats.missions.date === today && stats.missions.list.length === 3){
    for(const m of stats.missions.list){ const li = MT[m.t].lv.indexOf(m.target); if(li >= 0) m.reward = MT[m.t].rw[li]; }
    return;
  }
  const rnd = seeded(hashStr(today + (stats.name||'')));
  const list = [];
  for(let i=0;i<3;i++) list.push(genMission(rnd, list.map(m => m.t)));
  stats.missions = {date:today, list, rerolled:false, chest:false};
  saveStats();
}
function missionDone(m){
  if(m.done || m.prog < m.target) return;
  m.done = true; m.prog = m.target;
  showToast('Missão concluída! Resgate no menu');
  saveStats(); updateMenu();
}
function missionAdd(type, delta){ if(!delta) return; for(const m of stats.missions.list){ if(m.t === type && !m.done){ m.prog += delta; missionDone(m); } } }
function missionMax(type, v){ for(const m of stats.missions.list){ if(m.t === type && !m.done && v > m.prog){ m.prog = v; missionDone(m); } } }
function flushMissions(rank){
  if(!player) return;
  missionAdd('eat', track.eat - track.eatF); track.eatF = track.eat;
  missionAdd('boops', track.boops - track.boopsF); track.boopsF = track.boops;
  const bt = Math.floor(track.boostT); missionAdd('boost', bt - track.boostF); track.boostF = bt;
  missionMax('size', Math.floor(player.mass));
  missionMax('survive', Math.floor(track.time));
  if(rank > 0 && rank <= 50) missionMax('top10', 1);
  if(++track.saveTick % 12 === 0) saveStats();
}

const CHEST_RW = 5;
function streakInfo(){
  const st = stats.streak, today = dayKey();
  if(st.last === today) return {day:st.day, claimed:true};
  return {day: st.last === yesterdayKey() ? (st.day % 7) + 1 : 1, claimed:false};
}
function readyCount(){
  let n = streakInfo().claimed ? 0 : 1;
  const L = stats.missions.list;
  for(const m of L) if(m.done && !m.claimed) n++;
  if(!stats.missions.chest && L.length === 3 && L.every(m => m.claimed)) n++;
  return n;
}

function drawEyesStyled(g, hx, hy, d, ang, look, style, headCol){
  g.save(); g.translate(hx, hy); g.rotate(ang);
  const big = style === 'grandes';
  const ex = d*0.2, ey = d*(big ? 0.25 : 0.23), er = d*(big ? 0.27 : 0.2), pr = d*(big ? 0.15 : 0.115);
  const la = look - ang, lx = Math.cos(la)*d*0.075, ly = Math.sin(la)*d*0.075;
  g.fillStyle = '#ffffff'; g.beginPath(); g.arc(ex,-ey,er,0,TAU); g.arc(ex,ey,er,0,TAU); g.fill();
  g.fillStyle = '#101018'; g.beginPath(); g.arc(ex+lx,-ey+ly,pr,0,TAU); g.arc(ex+lx,ey+ly,pr,0,TAU); g.fill();
  if(big){ g.fillStyle = 'rgba(255,255,255,.95)'; g.beginPath(); g.arc(ex+lx-pr*0.3,-ey+ly-pr*0.35,pr*0.38,0,TAU); g.arc(ex+lx-pr*0.3,ey+ly-pr*0.35,pr*0.38,0,TAU); g.fill(); }
  if(style === 'sono'){
    g.fillStyle = headCol;
    g.beginPath(); g.arc(ex,-ey,er*1.08,-Math.PI/2,Math.PI/2); g.fill();
    g.beginPath(); g.arc(ex,ey,er*1.08,-Math.PI/2,Math.PI/2); g.fill();
    g.strokeStyle = '#101018'; g.lineWidth = Math.max(1.2, d*0.05); g.beginPath();
    g.moveTo(ex,-ey-er); g.lineTo(ex,-ey+er); g.moveTo(ex,ey-er); g.lineTo(ex,ey+er); g.stroke();
  }
  if(style === 'bravos'){
    g.strokeStyle = '#101018'; g.lineWidth = Math.max(1.6, d*0.085); g.lineCap = 'round'; g.beginPath();
    g.moveTo(ex-er*1.95,-ey-er*0.6); g.lineTo(ex-er*1.0,-ey+er*0.6);
    g.moveTo(ex-er*1.95, ey+er*0.6); g.lineTo(ex-er*1.0, ey-er*0.6); g.stroke();
  }
  g.restore();
}
function skinCol(skin, i){ const c = skin.c; return c.length === 1 ? c[0] : c[((i/(skin.band||BAND))|0) % c.length]; }
function drawSnakePath(g, pts, d, skin, blush){
  const n = pts.length;
  for(let i=n-1;i>=0;i--){
    const tl = n-1-i, sc = tl < 6 ? 0.5 + 0.5*(tl/6) : 1, ds = d*sc;
    g.drawImage(segSprite(skinCol(skin,i)), pts[i][0]-ds/2, pts[i][1]-ds/2, ds, ds);
  }
  const hd = d*1.06;
  g.drawImage(segSprite(skin.c[0]), pts[0][0]-hd/2, pts[0][1]-hd/2, hd, hd);
  const a = Math.atan2(pts[0][1]-pts[1][1], pts[0][0]-pts[1][0]);
  if(blush){
    g.fillStyle = 'rgba(255,110,150,.55)';
    const ca = Math.cos(a), sa = Math.sin(a);
    for(const sgn of [-1,1]){ g.beginPath(); g.ellipse(pts[0][0]-ca*d*0.05 - sa*sgn*d*0.36, pts[0][1]-sa*d*0.05 + ca*sgn*d*0.36, d*0.12, d*0.08, a, 0, TAU); g.fill(); }
  }
  drawEyesStyled(g, pts[0][0], pts[0][1], hd, a, a, skin.eyes || 'normal', skin.c[0]);
}
function drawMiniSnake(g, w, h, skin, t, o){
  const d = h*o.d, sp = d*0.3;
  const n = Math.max(6, Math.min(o.n, Math.floor((w - d*1.8)/sp)));
  const x0 = w/2 + (n-1)*sp/2;
  const pts = [];
  for(let i=0;i<n;i++) pts.push([x0 - i*sp, h/2 + Math.sin(t*0.003*(o.speed||1) - i*0.26)*h*o.amp]);
  if(o.fx) fxPreview(g, pts, d, skin, o.fx, t, false);
  drawSnakePath(g, pts, d, skin, o.blush);
  if(o.fx) fxPreview(g, pts, d, skin, o.fx, t, true);
}
function fxPreview(g, pts, d, skin, id, t, over){
  const n = pts.length, tl = pts[n-1], hd = pts[0], c = skin.c;
  const ang = Math.atan2(pts[0][1]-pts[1][1], pts[0][0]-pts[1][0]), ca = Math.cos(ang), sa = Math.sin(ang);
  if(!over){
    if(id === 'aura' || id === 'rainbow'){
      g.globalCompositeOperation = 'lighter'; g.globalAlpha = 0.65 + 0.2*Math.sin(t*0.004);
      for(let i=0;i<n;i+=2){ const col = id === 'rainbow' ? RAINBOW[(Math.floor(i/2) + Math.floor(t/80)) % 7] : (skin.glow || c[0]); const gs = d*2.4; g.drawImage(glowSprite(col), pts[i][0]-gs/2, pts[i][1]-gs/2, gs, gs); }
      g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
    }
    if(id === 'trail' || id === 'rainbow'){
      g.globalCompositeOperation = 'lighter';
      for(let k=0;k<10;k++){ const ph = (t*0.0012 + k/10) % 1, sz = d*0.7*(1-ph);
        const col = id === 'rainbow' ? RAINBOW[k % 7] : c[k % c.length];
        g.drawImage(foodSprite(col), tl[0] - ph*d*3 - sz/2, tl[1] + Math.sin(k*2.3 + t*0.004)*d*0.6*ph - sz/2, sz, sz); }
      g.globalCompositeOperation = 'source-over';
    }
    if(id === 'hearts'){
      for(let k=0;k<5;k++){ const ph = (t*0.0008 + k/5) % 1; g.globalAlpha = 1 - ph;
        drawHeart(g, tl[0] - ph*d*2.6, tl[1] - ph*d*1.1 + Math.sin(k*1.7)*d*0.35, d*0.22, ['#ff5fa6','#ff8fa0','#ff4545'][k % 3]); }
      g.globalAlpha = 1;
    }
    if(id === 'bubbles'){
      for(let k=0;k<6;k++){ const ph = (t*0.0007 + k/6) % 1, rr = d*(0.12 + 0.25*ph); g.globalAlpha = 1 - ph;
        const bx = tl[0] - ph*d*2.4 + Math.sin(k*2.1)*d*0.3, by = tl[1] - ph*d*1.3;
        g.strokeStyle = '#aef0ff'; g.lineWidth = 1.4; g.beginPath(); g.arc(bx, by, rr, 0, TAU); g.stroke();
        g.fillStyle = 'rgba(255,255,255,.7)'; g.beginPath(); g.arc(bx - rr*0.35, by - rr*0.35, rr*0.22, 0, TAU); g.fill(); }
      g.globalAlpha = 1;
    }
    return;
  }
  if(id === 'eyes'){
    g.globalCompositeOperation = 'lighter'; const gs = d*1.4*(1 + 0.2*Math.sin(t*0.008)), gsp = glowSprite('#ffc62e');
    for(const sg of [-1,1]){ const ex = hd[0] + ca*d*0.21 - sa*sg*d*0.24, ey = hd[1] + sa*d*0.21 + ca*sg*d*0.24; g.drawImage(gsp, ex-gs/2, ey-gs/2, gs, gs); }
    g.globalCompositeOperation = 'source-over';
  }
  if(id === 'pulse'){
    for(let k=0;k<2;k++){ const ph = (t*0.001 + k/2) % 1; g.globalAlpha = 1 - ph; g.strokeStyle = c[0]; g.lineWidth = 2.5*(1-ph) + 0.5;
      g.beginPath(); g.arc(hd[0], hd[1], d*(0.6 + ph*2.2), 0, TAU); g.stroke(); }
    g.globalAlpha = 1;
  }
  if(id === 'bolt'){
    const base = Math.floor(t/90);
    g.globalCompositeOperation = 'lighter';
    for(let k=0;k<3;k++){ const sd = base*7 + k*131 + 1, p = pts[(sd*13) % n]; drawBolt(g, p[0], p[1], d*1.3, (sd % 628)/100, sd, '#c8f6ff'); }
    g.globalCompositeOperation = 'source-over';
  }
  if(id === 'confetti'){
    const ph = (t*0.0006) % 1, cols = ['#ff4545','#ffc62e','#7dff6e','#4fb2ff','#c080ff','#ff5fa6'];
    g.globalAlpha = 1 - ph;
    for(let k=0;k<16;k++){ const a = k/16*TAU, dist = ph*d*2.2 + d*0.5;
      g.save(); g.translate(hd[0] + Math.cos(a)*dist, hd[1] + Math.sin(a)*dist); g.rotate(a + ph*6); g.fillStyle = cols[k % 6];
      g.fillRect(-d*0.12, -d*0.05, d*0.24, d*0.1); g.restore(); }
    g.globalAlpha = 1;
  }
}
function fitCanvas(cv){
  const w = cv.clientWidth, h = cv.clientHeight, pr = Math.min(window.devicePixelRatio||1, 2);
  if(cv.width !== Math.round(w*pr) || cv.height !== Math.round(h*pr)){ cv.width = Math.round(w*pr); cv.height = Math.round(h*pr); }
  const g = cv.getContext('2d'); g.setTransform(pr,0,0,pr,0,0); g.clearRect(0,0,w,h);
  return {g, w, h};
}
function paintBgThumb(g, w, h, bg, scale){
  const pat = g.createPattern(bgTile(bg), 'repeat');
  g.save(); g.scale(scale, scale); g.fillStyle = pat; g.fillRect(0, 0, w/scale+2, h/scale+2); g.restore();
}

const menuFood = [];
for(let i=0;i<70;i++) menuFood.push({x:Math.random(), y:Math.random(), vx:rand(-0.00004,0.00004), vy:rand(-0.00004,0.00004), c:FOOD_COLORS[(Math.random()*FOOD_COLORS.length)|0], r:rand(3,7), ph:rand(0,TAU)});
const menuSnakes = [];
function rollMenuSnakes(){
  menuSnakes.length = 0;
  const picks = SKINS.filter(s => s.r !== 'comum');
  for(let i=0;i<3;i++) menuSnakes.push({skin:picks[(Math.random()*picks.length)|0], fx:rand(0.7,1.1), fy:rand(1.2,1.8), ph:rand(0,TAU), sp:rand(0.8,1.2)});

let menuRaf = 0, sheetOpen = false;
function menuFrame(t){
  if(running){ menuRaf = 0; return; }
  if(!sheetOpen){
    ctx.setTransform(DPR,0,0,DPR,0,0);
    const sc = viewScale()/BG_S*0.9;
    ctx.save(); ctx.scale(sc, sc);
    const ox = (t*0.012) % 100000, oy = (t*0.007) % 100000;
    ctx.translate(-ox, -oy); ctx.fillStyle = bgPattern; ctx.fillRect(ox, oy, W/sc+4, H/sc+4); ctx.restore();
    if(stats.hq) ctx.globalCompositeOperation = 'lighter';
    for(const f of menuFood){
      f.x = (f.x + f.vx*16 + 1) % 1; f.y = (f.y + f.vy*16 + 1) % 1;
      const s = f.r*3.4*(1 + 0.13*Math.sin(t*0.0045 + f.ph));
      ctx.drawImage(foodSprite(f.c), f.x*W - s/2, f.y*H - s/2, s, s);
    }
    ctx.globalCompositeOperation = 'source-over';
    const d = Math.max(18, Math.min(W,H)*0.05);
    for(const ms of menuSnakes){
      const pts = [], tt = t*0.00016*ms.sp, step = d*0.3;
      let px = 0, py = 0, acc = 0;
      for(let i=0;i<900 && pts.length<48;i++){
        const u = tt - i*0.0004;
        const x = W*0.5 + W*0.62*Math.sin(ms.fx*u*6 + ms.ph), y = H*0.5 + H*0.5*Math.sin(ms.fy*u*6 + ms.ph*1.7);
        if(i === 0){ pts.push([x,y]); px = x; py = y; continue; }
        acc += Math.hypot(x-px, y-py); px = x; py = y;
        if(acc >= step){ pts.push([x,y]); acc = 0; }
      }
      if(pts.length < 2) continue;
      drawSnakePath(ctx, pts, d, ms.skin, false);
    }
  }
  const skin = curSkin();
  if(!$('menu').classList.contains('hidden')){
    const a = fitCanvas($('logoSnake')); drawMiniSnake(a.g, a.w, a.h, skin, t, {n:40, d:0.28, amp:0.2, speed:1, blush:true});
    const b = fitCanvas($('skinPreview')); drawMiniSnake(b.g, b.w, b.h, skin, t*1.3, {n:16, d:0.26, amp:0.18, speed:1, blush:true, fx:stats.fxId});
  }
  if(!$('shop').classList.contains('hidden') && shopTab === 'efeitos'){
    const sk = curSkin();
    for(const [cv, id] of fxCards){ const f = fitCanvas(cv); paintBgThumb(f.g, f.w, f.h, curBg(), 0.26); drawMiniSnake(f.g, f.w, f.h, sk, t, {n:16, d:0.3, amp:0.15, speed:1, fx:id}); }
  }
  const cc = $('creatorCv');
  if(cc && !$('shop').classList.contains('hidden')){
    const f = fitCanvas(cc); paintBgThumb(f.g, f.w, f.h, curBg(), 0.45);
    drawMiniSnake(f.g, f.w, f.h, creatorSkin(), t, {n:30, d:0.28, amp:0.2, speed:1.2, blush:true});
  }
  menuRaf = requestAnimationFrame(menuFrame);
}

function renderSkinsTab(body){
  const mine = SKINS.filter(s => stats.owned.includes(s.id));

  const sections = [['Suas skins', custom.concat(mine)], ['Comuns', SKINS.filter(s => s.r==='comum' && !stats.owned.includes(s.id))],
    ['Raras', SKINS.filter(s => s.r==='rara' && !stats.owned.includes(s.id))], ['Lendárias', SKINS.filter(s => s.r==='lendaria' && !stats.owned.includes(s.id))]];

  stats.custom.push(cs); registerCustom(cs); stats.skinId = cs.id;

function openMissions(){ openSheet('missions'); renderMissions(); }
function renderMissions(){
  ensureDaily();
  const L = stats.missions.list, claimedN = L.filter(m => m.claimed).length, info = streakInfo();
  const body = $('missionsBody');
  let chestHtml;
  if(stats.missions.chest) chestHtml = '<div class="chestTxt">Baú aberto! Volte amanhã para outro</div>';
  else if(claimedN === 3) chestHtml = '<button class="gummy gold cBtn pulse" id="chestBtn" style="margin-top:6px;width:100%">Abrir baú +'+CHEST_RW+' <span class="gem sm"></span></button>';
  else chestHtml = '<div class="chestTxt">Resgate as 3 missões para abrir o baú de '+CHEST_RW+' diamantes</div>';
  body.innerHTML = '<div class="mHero"><h3>Missões do dia</h3><div class="timer">Novas missões em '+timeToMidnight()+'</div>'+
    '<div class="chestRow">'+CHEST_SVG+'<div style="flex:1"><div class="pips">'+L.map(m => '<div class="pip'+(m.claimed?' full':'')+'"><i></i></div>').join('')+'</div>'+chestHtml+'</div></div></div>'+
    '<div class="secTitle">Hoje<i></i></div><div id="mList"></div>'+
    '<div class="glass streakCard"><div class="streakHead">Bônus diário <small>Dia '+info.day+' de 7</small></div><div class="days" id="days"></div>'+
    '<button class="gummy '+(info.claimed?'plain':'green pulse')+' cBtn" id="streakBtn" style="width:100%;margin-top:10px"'+(info.claimed?' disabled':'')+'>'+(info.claimed ? 'Volte amanhã' : 'Pegar '+STREAK_RW[info.day-1]+' Escamas')+'</button></div>';
  const list = $('mList');
  L.forEach((m, idx) => {
    const def = MT[m.t], pct = Math.min(100, m.prog/m.target*100);
    const unit = (m.t === 'survive' || m.t === 'boost') ? ' s' : '';
    const el = document.createElement('div'); el.className = 'mission'+(m.claimed ? ' claimed' : m.done ? ' ready' : '');
    el.innerHTML = '<div class="mIco" style="background:'+def.col+';color:#241a5c">'+ico(def.ic)+'</div>'+
      '<div class="mBody"><div class="mTxt">'+def.txt(m.target)+'</div><div class="mBar"><i style="width:'+pct.toFixed(1)+'%"></i><span>'+fmt(Math.min(m.prog,m.target))+' de '+fmt(m.target)+unit+'</span></div></div>'+
      '<div class="mSide"><div class="mRw"><span class="gem sm"></span>'+m.reward+'</div></div>';
    const side = el.querySelector('.mSide');
    if(m.claimed){ const t = document.createElement('div'); t.className = 'usingTag'; t.style.height = '36px'; t.innerHTML = '<svg viewBox="0 0 24 24" width="20" height="20">'+ICON.check+'</svg>'; side.appendChild(t); }
    else if(m.done){ const b = document.createElement('button'); b.className = 'gummy gold cBtn pulse'; b.textContent = 'Pegar';
      b.onclick = () => { m.claimed = true; addGems(m.reward); beep(880,0.12,0.04); showToast('+'+m.reward+' diamantes'); renderMissions(); updateMenu(); }; side.appendChild(b); }
    else if(!stats.missions.rerolled){ const b = document.createElement('button'); b.className = 'reroll'; b.setAttribute('aria-label','Trocar missão assistindo um vídeo'); b.innerHTML = ico('refresh');
      b.onclick = () => showRewardedAd(() => {
        const others = L.filter((_,j) => j !== idx).map(x => x.t); others.push(m.t);
        L[idx] = genMission(Math.random, others); stats.missions.rerolled = true; saveStats(); renderMissions(); showToast('Missão trocada');
      }); side.appendChild(b); }
    list.appendChild(el);
  });
  let dh = '';
  for(let i=1;i<=7;i++){
    const done = i < info.day || (i === info.day && info.claimed);
    const cls = (done ? ' done' : (i === info.day ? ' today' : '')) + (i === 7 ? ' big' : '');
    dh += '<div class="day'+cls+'"><small>Dia '+i+'</small><b>'+(done ? '✓' : STREAK_RW[i-1])+'</b></div>';
  }
  $('days').innerHTML = dh;
  $('streakBtn').onclick = () => {
    const inf = streakInfo(); if(inf.claimed) return;
    stats.streak = {last:dayKey(), day:inf.day}; addCoins(STREAK_RW[inf.day-1]); beep(880,0.12,0.04);
    showToast('+'+STREAK_RW[inf.day-1]+' Escamas'); renderMissions(); updateMenu();
  };
  const cb = $('chestBtn');
  if(cb) cb.onclick = () => { stats.missions.chest = true; addGems(CHEST_RW); beep(990,0.2,0.05); showToast('Baú aberto! +'+CHEST_RW+' diamantes'); renderMissions(); updateMenu(); };
}

  let left = rewarded ? 5 : 3;
  $('adModal').classList.remove('hidden');
  $('adText').textContent = rewarded ? 'Assista até o fim para ganhar o prêmio' : 'Intervalo comercial';
  $('adClaim').classList.add('hidden'); $('adClose').classList.toggle('hidden', !rewarded);
  $('adCount').textContent = left; $('adCount').classList.remove('hidden');
  clearInterval(adTimer);
  adTimer = setInterval(() => {
    left--; $('adCount').textContent = left;
    if(left <= 0){ clearInterval(adTimer); $('adCount').classList.add('hidden'); if(rewarded) $('adClaim').classList.remove('hidden'); else $('adClose').classList.remove('hidden'); }
  }, 1000);
  $('adClaim').onclick = () => { closeAd(); if(cb) cb(); };
  $('adClose').onclick = () => { closeAd(); if(!rewarded && cb) cb(); };
}
function closeAd(){ clearInterval(adTimer); $('adModal').classList.add('hidden'); }
function showRewardedAd(cb){ showAd(true, cb); }
function showInterstitialAd(cb){ showAd(false, cb); }
function maybeInterstitial(cb){
  if(!stats.noAds && stats.deaths > 0 && stats.deaths % 3 === 0 && (performance.now() - sessionStart) > 120000) showInterstitialAd(cb); else cb();
}

/* ---------- menu wiring ---------- */
function showToast(msg){
  const el = $('toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(showToast.h); showToast.h = setTimeout(() => el.classList.remove('show'), 1700);
}
function updateMenu(){
  ensureDaily();
  $('lastSize').textContent = fmt(stats.last.size); $('lastBoops').textContent = fmt(stats.last.boops);
  $('bestSize').textContent = fmt(stats.best.size); $('bestBoops').textContent = fmt(stats.best.boops);
  refreshCoins();
  const n = readyCount(), b = $('missionBadge');
  b.textContent = n; b.classList.toggle('hidden', n === 0);
}
function toMenu(){
  running = false;
  $('deathScreen').classList.add('hidden'); $('hud').classList.add('hidden'); $('menu').classList.remove('hidden');
  $('nameInput').value = stats.name || '';
  rollMenuSnakes(); updateMenu(); startMenuAnim();
}
$('gearIco').innerHTML = ICON.gear.replace('#1d1850','#2b1872');
$('missionIco').innerHTML = CHEST_SVG;
for(const id of ['shopClose','missionsClose','settingsClose']) $(id).innerHTML = '<svg viewBox="0 0 24 24" width="24" height="24">'+ICON.back+'</svg>';
$('adClose').innerHTML = '<svg viewBox="0 0 24 24" width="20" height="20">'+ICON.close+'</svg>';
/* the game needs a connection (ads, future online features), so it stays locked while offline */
function isOnline(){ return navigator.onLine !== false; }
function checkOnline(){ const on = isOnline(); $('offline').classList.toggle('hidden', on || running); return on; }
function tryPlay(){ if(!checkOnline()){ $('offline').classList.remove('hidden'); return; } startGame(); }
window.addEventListener('online', checkOnline);
window.addEventListener('offline', checkOnline);
$('retryBtn').addEventListener('click', () => { if(checkOnline()) showToast('Conectado!'); else showToast('Ainda sem internet'); });
$('playBtn').addEventListener('click', tryPlay);
$('againBtn').addEventListener('click', () => maybeInterstitial(tryPlay));
$('menuBtn').addEventListener('click', () => maybeInterstitial(toMenu));
$('doubleBtn').addEventListener('click', () => showRewardedAd(() => {
  if(doubled) return; doubled = true; addCoins(lastEarn);
  $('earnVal').textContent = lastEarn*2; $('doubleBtn').classList.add('hidden'); showToast('Escamas dobradas!');
}));
$('nameInput').addEventListener('keydown', e => { if(e.key === 'Enter') tryPlay(); });
$('nameInput').addEventListener('change', e => { stats.name = e.target.value.trim(); saveStats(); });
$('shopBtn').addEventListener('click', () => openShop('skins'));
$('menuCoins').addEventListener('click', () => openShop('escamas'));
$('menuCoins').addEventListener('keydown', e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openShop('escamas'); } });
$('missionsBtn').addEventListener('click', openMissions);
$('settingsBtn').addEventListener('click', openSettings);
$('shopClose').addEventListener('click', () => closeSheet('shop'));
$('missionsClose').addEventListener('click', () => closeSheet('missions'));
$('settingsClose').addEventListener('click', () => closeSheet('settings'));
window.addEventListener('keydown', e => {
  if(e.key !== 'Escape') return;
  for(const id of ['shop','missions','settings']) if(!$(id).classList.contains('hidden')) closeSheet(id);
});

$('nameInput').value = stats.name || '';
updateMenu();
checkOnline();
startMenuAnim();
})();
</script>
</body>
</html>
